entity_label: PatientRecord

dimensions:
  weights:
    completeness: 0.25
    validity: 0.35
    uniqueness: 0.25
    outliers: 0.15

fields:
  hospital_id:
    type: id
    required: true
    unique_key: true

  full_name:
    type: text
    required: true
    fuzzy_key: true

  date_of_birth:
    type: date
    required: true
    min: "1900-01-01"
    max: "2026-12-31"

  gender:
    type: enum
    required: true
    allowed_values:
      - Male
      - Female
      - Other

  diagnosis_code:
    type: text
    required: false

  ward:
    type: text
    required: false
